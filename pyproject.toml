[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weread2notion"
version = "2.0.0"
description = "Sync your WeRead bookshelf, progress, highlights, notes, and reading statistics to Notion."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hodgekou"}]
keywords = ["weread", "wechat-reading", "notion", "reading-notes", "github-actions"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests",
  "notion-client",
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/Quashy/weread2notion-AI"
Documentation = "https://github.com/Quashy/weread2notion-AI#readme"
Issues = "https://github.com/Quashy/weread2notion-AI/issues"
Template = "https://titanium-echidna-59b.notion.site/Template-9304aad76d888294b90981a37bbbc42c"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
weread2notion = "weread2notion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
